spring.application.name=firmaya-api

# FirmaYA no usa el UserDetailsService/AuthenticationManager por defecto de Spring Security:
# la autenticacion es propia por cookie de sesion interna (ver seguridad.SeguridadConfig).
# Se excluye la autoconfiguracion para no generar ni loguear una contrasena de desarrollo sin uso.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Conexion a SQL Server (contenedor docker existente: firmaya-sqlserver, ver compose.yaml)
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:14333;databaseName=firmaya_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
# El valor por defecto replica el .env del proyecto (MSSQL_SA_PASSWORD) porque
# Spring Boot no carga archivos .env automaticamente; si el .env cambia, actualizar
# DB_PASSWORD como variable de entorno o este default.
spring.datasource.password=${DB_PASSWORD:FirmayaLolo123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate: el esquema lo administra Flyway; Hibernate solo valida contra el existente.
# physical-strategy=standard evita que Spring reescriba a snake_case los nombres de tabla
# ya explicitos (PascalCase) del script SQL Server; los @Table/@Column ya citan los
# identificadores fisicos exactos de FirmaYA_Creacion_Base_Datos_SQLServer_v1.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: historial en dbo (ya existe), tablas de negocio en el esquema firmaya
spring.flyway.enabled=true
spring.flyway.default-schema=dbo
spring.flyway.baseline-on-migrate=false

# Correo saliente (activacion, recuperacion de contrasena, notificaciones). Sin credenciales
# reales configuradas en este entorno: la app arranca igual y el envio queda registrado
# como fallido (estado_entrega = ERROR) en firmaya.Notificacion / firmaya.IntentoNotificacion.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
firmaya.correo.remitente=${MAIL_FROM:no-responder@firmaya.local}

# Parametros de sesion y seguridad propios de FirmaYA (no cubiertos por ParametroSistema)
firmaya.sesion.duracion-horas=${SESION_INTERNA_HORAS:8}
# Origen permitido por CORS para el frontend Next.js (integracion CU-19/CU-21). Sin
# despliegue definido en este entorno, se usa el puerto por defecto de "next dev".
firmaya.frontend.origen-cors=${FRONTEND_ORIGEN_CORS:http://localhost:3000}
firmaya.recuperacion.duracion-minutos=30
# URL del frontend que consume el token de recuperacion; sin frontend definido en este
# entorno, se usa un valor de referencia documentado como [PENDIENTE].
firmaya.frontend.url-recuperacion-contrasena=${FRONTEND_URL_RECUPERACION:https://app.firmaya.local/recuperar-contrasena}
# URL del frontend que consume tokens de acceso externo (invitacion, consulta, firma);
# sin frontend definido en este entorno, valor de referencia documentado como [PENDIENTE].
firmaya.frontend.url-acceso-externo=${FRONTEND_URL_ACCESO_EXTERNO:https://app.firmaya.local/acceso}
firmaya.invitacion.duracion-dias=7
firmaya.firma.otp-minutos=10
firmaya.firma.otp-intentos-maximos=3
firmaya.accesos.inactividad-consulta-minutos=60
# PD-01 (vigencia maxima de enlace de firma sin fecha limite) sigue [PENDIENTE] en la
# especificacion; se usa este valor como tope provisional, documentado para revision.
firmaya.firma.solicitud-dias-defecto=30
# Secreto del servidor usado para derivar el verificador del OTP (HMAC), nunca para
# persistir el codigo de 6 digitos ni en claro ni con un hash simple. Debe sobrescribirse
# con una variable de entorno real fuera de este entorno de desarrollo.
firmaya.firma.otp-pepper=${OTP_PEPPER:firmaya-otp-pepper-dev-CAMBIAR-EN-PRODUCCION}
firmaya.login.intentos-maximos=5
firmaya.login.bloqueo-minutos=15

# CU-15: activacion de cuentas internas creadas por el Administrador (EP-04, EP-05, EP-18).
firmaya.activacion.duracion-horas=24
# URL del frontend que consume el token de activacion; sin frontend definido en este
# entorno, valor de referencia documentado como [PENDIENTE] (igual criterio que recuperacion).
firmaya.frontend.url-activacion-cuenta=${FRONTEND_URL_ACTIVACION:https://app.firmaya.local/activar-cuenta}

# CU-10: almacenamiento del PDF final generado. Sin integracion de almacenamiento de objetos
# (S3, Blob Storage, etc.) en este entorno; se persiste en disco local bajo este directorio,
# documentado como decision tecnica provisional (PD-08 sigue [PENDIENTE] en la especificacion).
firmaya.documentos.directorio-almacenamiento=${DOCUMENTOS_DIRECTORIO:./almacenamiento/documentos-finales}

# Documentacion interactiva (Swagger UI) en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
